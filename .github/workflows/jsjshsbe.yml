name: Build NESCA (Pure MSYS2)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Устанавливаем всё необходимое ИСКЛЮЧИТЕЛЬНО через MSYS2
      - name: Setup MSYS2 and install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-libssh
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-curl
          path-type: inherit

      # 2. Сборка. Вызываем qmake и make по АБСОЛЮТНЫМ путям, чтобы не было конфликтов.
      - name: Build project
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          
          # Проверяем, что curl на месте (на случай проблем с pacman)
          if [ ! -f "/mingw64/include/curl/curl.h" ]; then
            echo "ОШИБКА: curl/curl.h не найден! Вывод папки include:"
            ls /mingw64/include
            exit 1
          fi
          
          # Вызываем MSYS2-шный qmake и make напрямую
          /mingw64/bin/qmake nesca.pro
          /mingw64/bin/mingw32-make -j2

      # 3. Сбор DLL
      - name: Collect DLLs and build artifact
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          mkdir -p dist
          
          if [ -f release/nesca.exe ]; then cp release/nesca.exe dist/; else cp nesca.exe dist/; fi
          
          # windeployqt соберет все Qt-шные DLL
          /mingw64/bin/windeployqt dist/nesca.exe || true
          
          # Копируем зависимости сканера
          cp /mingw64/bin/libssh.dll dist/ || true
          cp /mingw64/bin/libssl-*.dll dist/ || true
          cp /mingw64/bin/libcrypto-*.dll dist/ || true
          cp /mingw64/bin/libcurl.dll dist/ || true
          cp /mingw64/bin/zlib1.dll dist/ || true
          cp /mingw64/bin/libzstd.dll dist/ || true
          cp /mingw64/bin/libbrotli*.dll dist/ || true
          
          # Системные библиотеки
          cp /mingw64/bin/libgcc_s_seh-1.dll dist/ || true
          cp /mingw64/bin/libstdc++-6.dll dist/ || true
          cp /mingw64/bin/libwinpthread-1.dll dist/ || true
          
          echo "=== Содержимое dist ==="
          ls -la dist

      # 4. Загрузка
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesca-windows
          path: dist/
          if-no-files-found: error
