name: Build NESCA (Windows)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-libssh
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-curl

      - name: Build project
        shell: msys2 {0}
        run: |
          # 1. АВТО-ПАТЧ: Вставляем #include <cmath> во ВСЕ .cpp файлы
          # Это разом исправит ошибки с pow(), log() и другими мат. функциями
          find . -name "*.cpp" -exec sed -i '1i #include <cmath>' {} +
          
          # 2. Добавляем системную библиотеку iphlpapi в проект (MinGW её теряет)
          if ! grep -q "iphlpapi" nesca.pro; then
            echo 'LIBS += -liphlpapi' >> nesca.pro
          fi
          
          # 3. Сборка
          if command -v qmake-qt5 &> /dev/null; then
            qmake-qt5 nesca.pro
          else
            qmake nesca.pro
          fi
          mingw32-make -j2

      - name: Collect DLLs
        shell: msys2 {0}
        run: |
          mkdir -p dist
          if [ -f release/nesca.exe ]; then cp release/nesca.exe dist/; else cp nesca.exe dist/; fi
          
          # Собираем Qt-библиотеки
          windeployqt dist/nesca.exe || true
          
          # Копируем всё необходимое из MSYS2
          cp /mingw64/bin/libssh.dll dist/ || true
          cp /mingw64/bin/libssl-*.dll dist/ || true
          cp /mingw64/bin/libcrypto-*.dll dist/ || true
          cp /mingw64/bin/libcurl.dll dist/ || true
          cp /mingw64/bin/zlib1.dll dist/ || true
          cp /mingw64/bin/libzstd.dll dist/ || true
          cp /mingw64/bin/libbrotli*.dll dist/ || true
          cp /mingw64/bin/libgcc_s_seh-1.dll dist/ || true
          cp /mingw64/bin/libstdc++-6.dll dist/ || true
          cp /mingw64/bin/libwinpthread-1.dll dist/ || true
          
          echo "=== Готовый архив ==="
          ls -la dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesca-windows
          path: dist/
          if-no-files-found: error
