name: Build NESCA for Windows (Pure MSYS2)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Устанавливаем всё через MSYS2. 
      # Используем встроенный параметр install, он работает надежнее, чем ручной вызов pacman.
      - name: Setup MSYS2 and install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-libssh
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-curl
          path-type: inherit

      # 2. Сборка проекта
      - name: Build project
        shell: msys2 {0}
        run: |
          qmake nesca.pro
          mingw32-make -j2

      # 3. Сбор DLL-файлов для запуска
      - name: Collect DLLs and build artifact
        shell: msys2 {0}
        run: |
          mkdir -p dist
          if [ -f release/nesca.exe ]; then cp release/nesca.exe dist/; else cp nesca.exe dist/; fi
          
          # windeployqt автоматически подтянет все нужные DLL от Qt
          windeployqt dist/nesca.exe
          
          # Копируем библиотеки, которые нужны для SSH, SSL и CURL
          cp /mingw64/bin/libssh.dll dist/ || true
          cp /mingw64/bin/libssl-*.dll dist/ || true
          cp /mingw64/bin/libcrypto-*.dll dist/ || true
          cp /mingw64/bin/libcurl.dll dist/ || true
          cp /mingw64/bin/zlib1.dll dist/ || true
          cp /mingw64/bin/libzstd.dll dist/ || true
          cp /mingw64/bin/libbrotli*.dll dist/ || true
          
          # Копируем системные библиотеки MinGW
          cp /mingw64/bin/libgcc_s_seh-1.dll dist/ || true
          cp /mingw64/bin/libstdc++-6.dll dist/ || true
          cp /mingw64/bin/libwinpthread-1.dll dist/ || true
          
          echo "=== Содержимое папки dist ==="
          ls -la dist

      # 4. Загрузка артефакта
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesca-windows
          path: dist/
          if-no-files-found: error
