name: Build Docker Image

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 1 (опционально, но рекомендуется): Настройка Buildx для продвинутой сборки
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Шаг 2: Сборка образа. Параметр `context: .` — это аналог точки в вашей команде `docker build .`
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false  # Мы пока не отправляем образ в реестр (например, Docker Hub)
          tags: my-app:latest
          # Сохраняем образ в файл, чтобы потом загрузить его как артефакт
          outputs: type=docker,dest=/tmp/image.tar

      # Шаг 3: Сохранение образа как артефакта для скачивания
      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1
