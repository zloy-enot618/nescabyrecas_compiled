name: Build Nesca (full rebuild, MinGW)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt 5.15 (MinGW 32-bit)
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        arch: 'win32_mingw81'
        cache: true

    - name: Setup MSYS2 (MinGW32)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW32
        update: true
        install: >-
          mingw-w64-i686-toolchain
          mingw-w64-i686-libssh
          mingw-w64-i686-openssl
          mingw-w64-i686-curl
          mingw-w64-i686-libsasl
          mingw-w64-i686-openldap
          mingw-w64-i686-zlib
          pkg-config

    - name: Build
      shell: msys2 {0}
      run: |
        qmake nesca.pro
        mingw32-make -j$(nproc)

    - name: Deploy Qt + MinGW runtime
      shell: cmd
      run: |
        windeployqt.exe --release --compiler-runtime release\nesca.exe

    - name: Copy MinGW dependencies (ssh, curl, ssl, sasl, ldap, zlib)
      shell: msys2 {0}
      run: |
        cp /mingw32/bin/libssh*.dll          release/ 2>/dev/null || true
        cp /mingw32/bin/libcurl*.dll         release/ 2>/dev/null || true
        cp /mingw32/bin/libssl*.dll          release/ 2>/dev/null || true
        cp /mingw32/bin/libcrypto*.dll       release/ 2>/dev/null || true
        cp /mingw32/bin/libsasl*.dll         release/ 2>/dev/null || true
        cp /mingw32/bin/libldap*.dll         release/ 2>/dev/null || true
        cp /mingw32/bin/liblber*.dll         release/ 2>/dev/null || true
        cp /mingw32/bin/zlib1.dll            release/ 2>/dev/null || true

    - name: Copy password lists
      shell: cmd
      run: if exist "pwd_lists" xcopy /E /I /Y "pwd_lists" "release\pwd_lists"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nesca-mingw
        path: release/
