name: Build Nesca (Final)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-qt5
          mingw-w64-ucrt-x86_64-libssh
          mingw-w64-ucrt-x86_64-curl
          mingw-w64-ucrt-x86_64-openssl
          mingw-w64-ucrt-x86_64-zlib

    - name: Build
      shell: msys2 {0}
      run: |
        qmake nesca.pro
        mingw32-make -j$(nproc)

    - name: Collect DLLs and EXE
      shell: msys2 {0}
      run: |
        mkdir -p final_build
        cp release/nesca.exe final_build/ || cp nesca.exe final_build/
        # Автоматически собираем все нужные DLL-ки
        ldd final_build/nesca.exe | grep "ucrt64/bin" | awk '{print $3}' | xargs -I {} cp {} final_build/
        # Копируем списки паролей
        cp -r pwd_lists final_build/ || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nesca-windows
        path: final_build/
