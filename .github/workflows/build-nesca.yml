name: Build Nesca (Auto-Detect)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-qt5
          mingw-w64-x86_64-qt5-tools
          mingw-w64-x86_64-libssh
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-make
          mingw-w64-x86_64-gcc

    - name: Auto-Detect and Build
      shell: msys2 {0}
      run: |
        echo "=== 1. Проверяем, что лежит в репозитории ==="
        ls -la
        
        echo "=== 2. Ищем файлы проекта (.pro) ==="
        PRO_FILE=$(find . -name "*.pro" | head -n 1)
        
        if [ -z "$PRO_FILE" ]; then
          echo "Файл .pro НЕ НАЙДЕН! Возможно, это уже скомпилированная версия или не Qt-проект."
          echo "Пропускаем компиляцию."
        else
          echo "Найден файл проекта: $PRO_FILE"
          
          echo "=== 3. Ищем qmake ==="
          QMAKE_BIN=$(find /mingw64 -name "qmake.exe" | head -n 1)
          
          if [ -z "$QMAKE_BIN" ]; then
            echo "ОШИБКА: qmake не найден в /mingw64."
            exit 1
          fi
          
          echo "Найден qmake: $QMAKE_BIN"
          
          echo "=== 4. Запускаем сборку ==="
          cd $(dirname "$PRO_FILE")
          $QMAKE_BIN $(basename "$PRO_FILE")
          /mingw64/bin/mingw32-make.exe -j$(nproc)
        fi

    - name: Deploy Qt Dependencies (if compiled)
      shell: msys2 {0}
      run: |
        # Ищем собранный exe
        EXE_FILE=$(find . -name "nesca.exe" | head -n 1)
        
        if [ -n "$EXE_FILE" ]; then
          echo "Найден exe: $EXE_FILE. Собираем библиотеки..."
          mkdir -p deploy
          cp "$EXE_FILE" deploy/
          /mingw64/bin/windeployqt.exe --compiler-runtime deploy/nesca.exe
        else
          echo "Exe-файл не найден (возможно, компиляция не проводилась)."
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nesca-result
        path: |
          deploy/
          **/*.exe
          **/*.dll
