name: Build Nesca for Windows

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-qt5
          mingw-w64-x86_64-libssh
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-make
          mingw-w64-x86_64-gcc

    - name: Build with qmake and make
      shell: msys2 {0}
      run: |
        # Добавляем пути Qt и MinGW в PATH
        export PATH="/mingw64/bin:$PATH"
        
        # Запускаем qmake (файл nesca.pro должен лежать в корне репозитория)
        qmake nesca.pro
        
        # Запускаем сборку. Используем mingw32-make для надежности
        mingw32-make -j$(nproc)

    - name: Deploy Qt dependencies
      shell: msys2 {0}
      run: |
        export PATH="/mingw64/bin:$PATH"
        mkdir deploy
        
        # Ищем собранный exe-файл в любой папке и копируем его в deploy
        find . -name "nesca.exe" -exec cp {} deploy/ \;
        
        # Собираем все необходимые DLL библиотеки рядом с exe
        windeployqt.exe --compiler-runtime deploy/nesca.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nesca-windows-x64
        path: deploy/
