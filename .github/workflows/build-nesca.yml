name: Build Nesca for Windows

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-qt5-base
          mingw-w64-x86_64-qt5-tools
          mingw-w64-x86_64-libssh
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-make
          mingw-w64-x86_64-gcc

    - name: Build with qmake and make
      shell: msys2 {0}
      run: |
        # Вызываем qmake по абсолютному пути, чтобы обойти проблемы с PATH
        /mingw64/bin/qmake.exe nesca.pro
        
        # Вызываем make по абсолютному пути
        /mingw64/bin/mingw32-make.exe -j$(nproc)

    - name: Deploy Qt dependencies
      shell: msys2 {0}
      run: |
        mkdir deploy
        # Ищем exe в любой папке и копируем
        find . -name "nesca.exe" -exec cp {} deploy/ \;
        
        # Собираем DLL по абсолютному пути
        /mingw64/bin/windeployqt.exe --compiler-runtime deploy/nesca.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nesca-windows-x64
        path: deploy/
